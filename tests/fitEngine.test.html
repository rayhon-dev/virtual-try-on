<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FitCheck — fitEngine tests</title>
  <link rel="stylesheet" href="../css/base.css">
  <style>
    .test-page { max-width: 860px; margin: 0 auto; padding: var(--space-4); display: grid; gap: var(--space-4); }
    .summary { font-weight: 600; padding: var(--space-3) var(--space-4); border-radius: var(--radius-md); }
    .summary.ok   { background: #e6f4ea; color: var(--fit-good); }
    .summary.fail { background: #fbe9e9; color: var(--fit-too-tight); }
    .test { display: flex; gap: var(--space-3); padding: var(--space-3) 0; border-bottom: 1px solid var(--color-border); }
    .badge { flex: none; font-size: var(--text-xs); font-weight: 600; padding: 2px 10px; border-radius: var(--radius-pill); height: fit-content; }
    .badge.pass { background: #e6f4ea; color: var(--fit-good); }
    .badge.fail { background: #fbe9e9; color: var(--fit-too-tight); }
    .error { color: var(--color-error); font-size: var(--text-sm); font-family: monospace; margin-top: var(--space-1); }
  </style>
</head>
<body>
  <main class="test-page">
    <h1>fitEngine tests</h1>
    <div class="summary" id="summary">Running…</div>
    <div class="card" id="results"></div>
  </main>

  <script type="module">
    // Inline module: same as a separate .js file, just written inside the HTML.
    import { loadFitRules, loadGarments } from '../js/core/data.js';
    import { runAll } from './fitEngine.cases.js';

    const summary = document.getElementById('summary');
    const list = document.getElementById('results');

    try {
      // Promise.all = run both loads in parallel (like asyncio.gather)
      const [rules, garments] = await Promise.all([loadFitRules(), loadGarments()]);
      const results = runAll({ rules, garments });

      for (const r of results) {
        const row = document.createElement('div');
        row.className = 'test';
        row.innerHTML = `
          <span class="badge ${r.passed ? 'pass' : 'fail'}">${r.passed ? 'PASS' : 'FAIL'}</span>
          <div>${r.name}${r.passed ? '' : `<div class="error">${r.error}</div>`}</div>`;
        list.appendChild(row);
      }

      const passed = results.filter((r) => r.passed).length;
      summary.textContent = `${passed} / ${results.length} tests passed`;
      summary.className = `summary ${passed === results.length ? 'ok' : 'fail'}`;
    } catch (err) {
      summary.textContent = `Could not run tests: ${err.message}`;
      summary.className = 'summary fail';
    }
  </script>
</body>
</html>
